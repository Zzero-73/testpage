<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Bella Dama</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 1.5s ease;
    }

    /* Fondo con siluetas de flores rojas */
    .flower-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      opacity: 0.6;
      transition: opacity 1s ease;
    }

    .flower {
      width: 120px;
      height: 250px;
      fill: #8b0000;
      filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.4));
    }

    /* Destello central */
    .flash {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 50px 30px #ff3366, 0 0 100px 60px #ffffff;
      opacity: 0;
      transform: scale(0);
      transition: all 1.5s ease-out;
      z-index: 2;
    }

    .flash.active {
      opacity: 1;
      transform: scale(8);
    }

    /* Mensajes */
    .message {
      position: relative;
      z-index: 3;
      color: #ffffff;
      font-size: 2.2rem;
      text-align: center;
      padding: 20px;
      text-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
      opacity: 0;
      transition: opacity 2s ease;
    }

    .message.show {
      opacity: 1;
    }

    /* Estado Final (Pantalla Blanca) */
    body.final-state {
      background-color: #ffffff;
    }

    body.final-state .flower-container,
    body.final-state .flash {
      display: none;
    }

    body.final-state .message {
      color: #222222;
      font-size: 3rem;
      text-shadow: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Siluetas SVG de flores -->
  <div class="flower-container" id="flowers">
    <svg class="flower" viewBox="0 0 100 200">
      <path d="M50,200 Q45,140 50,80 C30,70 20,40 40,20 C50,10 50,30 50,30 C50,30 50,10 60,20 C80,40 70,70 50,80 Z"/>
    </svg>
    <svg class="flower" viewBox="0 0 100 200" style="height: 300px;">
      <path d="M50,200 Q55,130 50,70 C20,60 10,30 35,10 C50,0 50,25 50,25 C50,25 50,0 65,10 C90,30 80,60 50,70 Z"/>
    </svg>
    <svg class="flower" viewBox="0 0 100 200">
      <path d="M50,200 Q45,140 50,80 C30,70 20,40 40,20 C50,10 50,30 50,30 C50,30 50,10 60,20 C80,40 70,70 50,80 Z"/>
    </svg>
  </div>

  <!-- Elemento para el destello -->
  <div class="flash" id="flash"></div>

  <!-- Texto central -->
  <div class="message" id="text"></div>

  <script>
    const textElement = document.getElementById('text');
    const flashElement = document.getElementById('flash');

    // Paso 1: A los 10 segundos ocurre el destello y aparece el mensaje
    setTimeout(() => {
      flashElement.classList.add('active');

      setTimeout(() => {
        textElement.textContent = "Que linda tarde Bella Dama Gladys";
        textElement.classList.add('show');
      }, 500);
    }, 10000);

    // Paso 2: 5 segundos después del mensaje (segundo 15), la pantalla se vuelve blanca con "Fin"
    setTimeout(() => {
      document.body.classList.add('final-state');
      textElement.classList.remove('show');

      setTimeout(() => {
        textElement.textContent = "Fin";
        textElement.classList.add('show');
      }, 500);
    }, 15000);
  </script>
</body>
</html>
